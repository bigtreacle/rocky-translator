# Cutting a release:
#   git tag -a v1.0.0 -m "First release"
#   git push --tags
# A tag with a hyphen (v1.0.0-rc1) becomes a pre-release, which devices ignore
# because they only look at the "latest" release. The firmware checks the
# repository named by OTA_REPO in platformio.ini, which must be this one.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio

      - name: Version from tag
        id: ver
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          NOTES="$(git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d')"
          [ -n "$NOTES" ] || NOTES="Release $TAG"
          { echo "notes<<EOF_NOTES"; echo "$NOTES"; echo "EOF_NOTES"; } >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          PLATFORMIO_BUILD_FLAGS: -DFIRMWARE_VERSION=\"${{ steps.ver.outputs.version }}\"
        run: |
          pio run -e amoled18
          mkdir -p dist
          cp .pio/build/amoled18/firmware.bin dist/eridian-amoled18.bin

      - name: Write manifest
        run: |
          python3 -I scripts/make_manifest.py "$GITHUB_REPOSITORY" \
            "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.tag }}" dist \
            "$(printf '%s' "${{ steps.ver.outputs.notes }}" | head -n 1)"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.ver.outputs.notes }}
        run: |
          EXTRA=()
          [ "${{ steps.ver.outputs.prerelease }}" = "true" ] && EXTRA+=(--prerelease)
          gh release create "${{ steps.ver.outputs.tag }}" --title "${{ steps.ver.outputs.tag }}" \
            --notes "$NOTES" --verify-tag "${EXTRA[@]}" dist/eridian-amoled18.bin dist/manifest.json
