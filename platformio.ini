; Eridian Translator desk toy. Primary board: Waveshare ESP32-S3-Touch-AMOLED-1.8.
;
;   pio run -e amoled18 -t upload     flash over USB (close the serial monitor first;
;                                     the board does not leave download mode by itself,
;                                     power-cycle it after flashing)
;   pio device monitor                serial over USB CDC
;   pio run -e amoled18 -t uploadfs   write data/ to the LittleFS partition
;
; Later boards are extra [env:...] blocks with their own -DBOARD_... flag and
; src/boards/<name>/ folder. Nothing outside src/boards/ may contain a pin number.

[platformio]
default_envs = amoled18
boards_dir = boards

[env]
platform = espressif32 @ ^8.0.0
framework = arduino
monitor_speed = 115200
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Wall
lib_deps =
    lvgl/lvgl @ ^9.3
    bblanchon/ArduinoJson @ ^7

; FIRMWARE_VERSION defaults to "dev" in code; CI overrides it from the git tag:
;   PLATFORMIO_BUILD_FLAGS='-DFIRMWARE_VERSION=\"1.0.0\"' pio run -e amoled18

[env:amoled18]
board = waveshare_esp32_s3_touch_amoled_18
board_build.filesystem = littlefs
; The board enumerates as Espressif's native USB JTAG/serial unit (303a:1001).
; Pinning it by ID means a flash can never land on another ESP32 (the
; planespotter's CH340 on /dev/ttyUSB0) that happens to be plugged in.
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_FC:01:2C:D9:2C:60-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_FC:01:2C:D9:2C:60-if00
build_flags =
    ${env.build_flags}
    -DBOARD_AMOLED18=1
    -DBOARD_VARIANT=\"amoled18\"
build_src_filter = +<*> -<boards/> +<boards/amoled18/>
lib_deps =
    ${env.lib_deps}
    moononournation/GFX Library for Arduino @ ^1.6.9
    adafruit/Adafruit XCA9554 @ ^1.0
    lewisxhe/XPowersLib @ ^0.3
    lewisxhe/SensorLib @ ^0.5
